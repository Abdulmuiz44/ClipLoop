<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClipLane Native Short</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; font-family: "Inter", "Segoe UI", Arial, sans-serif; background: #07111d; }
      .frame { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: {{BG_COLOR}}; color: {{TEXT_COLOR}}; }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .18; }
      .short-brand { position: absolute; z-index: 20; top: 64px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; font-size: 25px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.72); }
      .short-brand span:last-child { color: #78f0b5; }
      .scene-timeline { position: absolute; inset: 0; }
      .scene-block { position: absolute; inset: 0; opacity: 0; pointer-events: none; overflow: hidden; animation: scene-cycle calc(var(--scene-duration-ms) * 1ms) both; animation-delay: calc(var(--scene-start-ms) * 1ms); }
      .scene-block.is-static { position: absolute; opacity: 1; animation: none; }
      .scene-block::before { content: ""; position: absolute; inset: 0; background: linear-gradient(145deg, {{BG_COLOR}}, #07111d 72%); }
      .scene-variant-1::before { background: linear-gradient(145deg, #29134f, #080e1f 74%); }
      .scene-variant-2::before { background: linear-gradient(145deg, #073d39, #071820 74%); }
      .scene-variant-3::before { background: linear-gradient(145deg, #57220d, #170d09 74%); }
      .scene-orb { position: absolute; width: 720px; height: 720px; right: -260px; top: 220px; border-radius: 50%; background: #44e7a0; filter: blur(0); opacity: .22; transform: scale(.75); animation: orb-pulse calc(var(--scene-duration-ms) * 1ms) both; animation-delay: calc(var(--scene-start-ms) * 1ms); }
      .scene-variant-1 .scene-orb { background: #9b7cff; left: -270px; top: 620px; }
      .scene-variant-2 .scene-orb { background: #2ee6d2; right: -330px; top: 900px; }
      .scene-variant-3 .scene-orb { background: #ff9f43; left: -280px; top: 330px; }
      .scene-copy { position: absolute; z-index: 2; left: 72px; right: 72px; top: 390px; }
      .scene-count { margin-bottom: 34px; color: #78f0b5; font-size: 30px; font-weight: 800; letter-spacing: .16em; }
      .scene-kicker { margin-bottom: 24px; color: rgba(255,255,255,.68); font-size: 28px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      .scene-primary { max-width: 900px; font-size: clamp(72px, 8vw, {{FONT_SIZE}}px); font-weight: 900; line-height: .96; letter-spacing: -.055em; text-wrap: balance; transform-origin: left bottom; animation: copy-punch calc(var(--scene-duration-ms) * 1ms) both; animation-delay: calc(var(--scene-start-ms) * 1ms); }
      .scene-secondary { max-width: 780px; margin-top: 42px; color: {{FOOTER_COLOR}}; font-size: 42px; font-weight: 600; line-height: 1.18; opacity: 0; transform: translateY(30px); animation: secondary-reveal calc(var(--scene-duration-ms) * 1ms) both; animation-delay: calc(var(--scene-start-ms) * 1ms); }
      .scene-cta { display: inline-flex; margin-top: 46px; padding: 20px 28px; border-radius: 999px; background: #78f0b5; color: #062516; font-size: 33px; font-weight: 900; transform: scale(.8); opacity: 0; animation: cta-pop calc(var(--scene-duration-ms) * 1ms) both; animation-delay: calc(var(--scene-start-ms) * 1ms); }
      .scene-progress { position: absolute; z-index: 4; left: 72px; right: 72px; bottom: 88px; height: 10px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.16); }
      .scene-progress::after { content: ""; display: block; height: 100%; width: 100%; transform: translateX(-100%); transform-origin: left; border-radius: inherit; background: #78f0b5; animation: progress-fill calc(var(--scene-duration-ms) * 1ms) linear both; animation-delay: calc(var(--scene-start-ms) * 1ms); }
      .caption, .channel, .hook, .cta { display: none; }
      @keyframes scene-cycle { 0%, 100% { opacity: 0; } 7%, 90% { opacity: 1; } }
      @keyframes orb-pulse { 0% { transform: scale(.55) rotate(-18deg); opacity: 0; } 18% { opacity: .26; } 100% { transform: scale(1.22) rotate(16deg); opacity: .16; } }
      @keyframes copy-punch { 0% { opacity: 0; transform: translateY(75px) scale(.86); } 15% { opacity: 1; transform: translateY(0) scale(1.04); } 28%, 88% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-24px) scale(.98); } }
      @keyframes secondary-reveal { 0%, 30% { opacity: 0; transform: translateY(30px); } 45%, 88% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-12px); } }
      @keyframes cta-pop { 0%, 54% { opacity: 0; transform: scale(.8); } 68%, 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.94); } }
      @keyframes progress-fill { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
  </head>
  <body>
    <div class="frame">
      <!-- OPTIONAL_BACKGROUND -->
      <div class="short-brand"><span>{{BUSINESS_NAME}}</span><span>Short</span></div>
      <div class="scene-timeline">{{SCENE_BLOCKS}}</div>
      <div class="caption">{{CHANNEL_CAPTION}}</div>
      <div class="channel">Scene flow: {{SCENE_PLAN_SUMMARY}}</div>
      <div class="hook">{{HOOK}}</div>
      <div class="cta">{{CHANNEL_CTA}}</div>
    </div>
  </body>
</html>
